name: zalo-platform
label: Zalo
kind: platform
version: 1.0.0
description: >
  Zalo gateway adapter for Hermes Agent.
  Connects a personal Zalo account (via zca-js, an unofficial reverse-engineered
  client) to Hermes through a local Node.js bridge over an HTTP API, so the bot
  can join group chats as a normal member and always answer in DMs.
  Groups are mention-gated by default; DMs always respond.
author: NousResearch
requires_env:
  - name: ZALO_ENABLED
    description: "Enable the Zalo adapter (requires pairing via `hermes zalo setup` and the Node.js bridge running)"
    prompt: "Enable Zalo? (true/false)"
    password: false
optional_env:
  - name: ZALO_ALLOWED_USERS
    description: "Legacy escape hatch — setting this disables Zalo's own owner/group access policy (config.yaml platforms.zalo.extra.owner_id/group_allow_from/groups) and falls back to this flat platform-wide allowlist for every Zalo chat"
    prompt: "Allowed users (comma-separated) — leave blank to use the owner/group policy instead"
    password: false
  - name: ZALO_ALLOW_ALL_USERS
    description: "Legacy escape hatch — allow any Zalo user platform-wide, bypassing Zalo's own owner/group access policy entirely (not recommended)"
    prompt: "Allow all users? (true/false) — leave false to use the owner/group policy instead"
    password: false
  - name: ZALO_HOME_CHANNEL
    description: "Default chat ID (e.g. u:123... or g:456...) for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: ZALO_DISABLE_DMS
    description: "Disable direct messages so the bot only responds in allowed groups"
    prompt: "Disable DMs? (true/false)"
    password: false
  - name: ZALO_REQUIRE_MENTION
    description: "Require an @mention of the bot before it responds in groups"
    prompt: "Require @mention in groups? (true/false)"
    password: false
  - name: ZALO_MENTION_NAME
    description: "Bot display name used as a text-match fallback for group mention gating"
    prompt: "Bot display name (for mention fallback matching)"
    password: false
  - name: ZALO_FREE_RESPONSE_CHATS
    description: "Comma-separated group chat IDs that bypass mention-gating and always respond"
    prompt: "Free-response group chat IDs (comma-separated)"
    password: false
  - name: ZALO_BRIDGE_PORT
    description: "Local HTTP port for the Zalo Node.js bridge (default 3050)"
    prompt: "Bridge port"
    password: false
